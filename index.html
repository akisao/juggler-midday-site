<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペカジャグ速報</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header>
  <h1>ペカジャグ速報</h1>
  <p id="when" class="when">読み込み中…</p>
  <div class="bar" id="slots"></div>
  <div class="bar" id="compare">
    <span>比べる相手:</span>
    <button data-cmp="all" class="on">全日</button>
    <button data-cmp="same">同じ区分</button>
  </div>
</header>
<main id="rows"></main>
<p id="missing" class="missing"></p>
<footer>
  <p>数字は店×機種の全台をまとめた「推定平均設定」です。その時刻までに座られた台だけで計算しています。</p>
  <p>「普段」は閉店時の確定データの平均です。昼の数字と比べると、昼のほうが高めに出やすい可能性があります。</p>
  <p><span class="few-sample">灰色</span>はデータがまだ少ない組です（稼働3台未満、または合計5,000G未満）。</p>
</footer>
<script src="app.js?v=1"></script>
</body>
</html>
