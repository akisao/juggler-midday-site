<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペカジャグ速報</title>
<link rel="stylesheet" href="style.css?v=1">
<!-- アイコンを変えたら ?v= も変える。同じ URL のままだと iPhone が古い絵を使い続ける（観測所 2026-09-27） -->
<link rel="manifest" href="manifest.webmanifest?v=20261001">
<link rel="icon" href="icons/favicon.ico?v=20261001">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261001">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ペカ速報">
<meta name="theme-color" content="#b22222">
</head>
<body>
<header>
  <h1>ペカジャグ速報</h1>
  <p id="when" class="when">読み込み中…</p>
  <div class="bar" id="slots"></div>
  <div class="bar" id="metric">
    <span>数字:</span>
    <button data-metric="comb" class="on">合算</button>
    <button data-metric="reg">REG</button>
  </div>
  <div class="bar" id="compare">
    <span>比べる相手:</span>
    <button data-cmp="all" class="on">全日</button>
    <button data-cmp="same">同じ区分</button>
  </div>
</header>
<main id="rows"></main>
<p id="missing" class="missing"></p>
<footer>
  <p>数字は店×機種の全台を合わせた合算確率（と REG 確率）を、メーカー公表値の設定1〜6の目盛りに置いた位置です（ペカジャグ観測所と同じ）。「5.3」なら設定5と6の間あたりの確率という意味で、平均設定そのものではありません。</p>
  <p>その時刻までに回った分だけで計算するので、閉店後より上下にぶれやすくなります。「普段」は閉店時の確定データを足し上げて同じ目盛りに置いたものです。</p>
  <p><span class="few-sample">灰色</span>はデータがまだ少ない組です（稼働3台未満、または合計5,000G未満）。</p>
</footer>
<script src="app.js?v=3"></script>
</body>
</html>
